# RRBB014, Minseo Gong's tmux configuration
# Updated for tmux 3.6

# ─────────────────────────────────────────
# 기본 설정
# ─────────────────────────────────────────

# config 리로드 (Ctrl+a + r)
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# 새 pane/window는 현재 경로로 열기
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Prefix: Ctrl+b -> Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 히스토리 크기
set -g history-limit 1000000

# 터미널 색상
set -ga terminal-overrides ',xterm-256color:Tc'

# ─────────────────────────────────────────
# 마우스 & 스크롤바 (tmux 3.6 신기능)
# ─────────────────────────────────────────

set -g mouse on
set -g pane-scrollbars on

# ─────────────────────────────────────────
# Pane 이동 (vim 키)
# ─────────────────────────────────────────

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Space select-pane -t :.+

# ─────────────────────────────────────────
# 윈도우 이동
# ─────────────────────────────────────────

bind Tab next-window
bind -r C-Space next-layout

# ─────────────────────────────────────────
# Pane 크기 조절
# ─────────────────────────────────────────

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─────────────────────────────────────────
# Pane 분할
# ─────────────────────────────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ─────────────────────────────────────────
# vi 복사 모드 (tmux 3.6 문법)
# ─────────────────────────────────────────

set -g mode-keys vi

bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi 'r' send -X rectangle-toggle

# ─────────────────────────────────────────
# 클립보드 연동 (xclip)
# ─────────────────────────────────────────

# Ctrl+a + Ctrl+c -> 시스템 클립보드로 복사
bind C-c run "tmux save-buffer - | wl-copy"

# Ctrl+a + Ctrl+v -> 시스템 클립보드에서 붙여넣기
bind C-v run 'tmux set-buffer "$(wl-paste --no-newline)"; tmux paste-buffer'

bind P paste-buffer

# ─────────────────────────────────────────
# Popup 창
# ─────────────────────────────────────────

# lazygit popup (Ctrl+a + g)
bind g display-popup -d '#{pane_current_path}' -w 90% -h 90% -E lazygit

# 빠른 쉘 popup (Ctrl+a + e)
bind e display-popup -d '#{pane_current_path}' -w 80% -h 80% -E bash

# Popup 닫기 (Ctrl+a + q) - popup 안에서도 동작
bind q if-shell '[ -n "$TMUX_POPUP" ]' 'detach-client' 'display-popup -C'

# Claude Code popup - 세션 유지 버전 (Ctrl+a + y)
# 1) claude-popup 세션이 없으면 먼저 만들고
# 2) popup에서 attach (nested tmux 문제 방지)
# 3) popup 안에서 다시 누르면 무시 (TMUX_POPUP 환경변수로 감지)
bind y if-shell '[ -n "$TMUX_POPUP" ]' '' \
  'run-shell "tmux has-session -t claude-popup 2>/dev/null || tmux new-session -d -s claude-popup -c #{pane_current_path} claude; tmux display-popup -e TMUX_POPUP=1 -w 90% -h 90% -E \"tmux attach-session -t claude-popup\""'

# Dev layout: 좌우 분할 (claude-code | btop) (Ctrl+a + D)
bind D split-window -h -c "#{pane_current_path}" "btop" \; select-pane -L \; send-keys "claude" Enter

# ─────────────────────────────────────────
# URL 열기 (fzf + xdg-open)
# ─────────────────────────────────────────

# Ctrl+a + u -> 현재 pane의 URL 목록 fzf로 선택 후 브라우저 열기
bind u capture-pane -J \; \
  save-buffer /tmp/tmux-buffer \; \
  split-window -v "grep -oE 'https?://[^ ]+' /tmp/tmux-buffer | fzf | xargs xdg-open"

# ─────────────────────────────────────────
# tmux-resurrect (세션 저장/복원)
# ─────────────────────────────────────────

run-shell ~/tmux-resurrect/resurrect.tmux
