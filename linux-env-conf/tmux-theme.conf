# ─────────────────────────────────────────
# 테마 & Status Bar (Tokyo Night 스타일)
# ─────────────────────────────────────────

# 상태바 갱신 주기 (초)
set -g status-interval 2

# 상태바 전체 길이
set -g status-left-length 60
set -g status-right-length 150

# 상태바 기본 색상
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# ── 왼쪽: 세션명 + 모드 표시 ──────────────────
set -g status-left "\
#[bg=#7aa2f7,fg=#1a1b26,bold] 󰓆 #S \
#[bg=#3b4261,fg=#7aa2f7] \
#[bg=#1a1b26,fg=#3b4261]\
#[bg=#1a1b26,fg=#565f89] #(whoami)@#H \
#[fg=#3b4261] "

# ── 오른쪽: git + CPU + MEM + 날짜시간 ───────
set -g status-right "\
#[fg=#3b4261]#[bg=#3b4261,fg=#565f89] \
#[fg=#7dcfff]#{?#{!=:#(cd #{pane_current_path}; git branch --show-current 2>/dev/null),}, #(cd #{pane_current_path}; git branch --show-current 2>/dev/null) ,}\
#[fg=#3b4261,bg=#3b4261]#[fg=#565f89]\
 CPU:#[fg=#9ece6a]#(top -bn1 | grep 'Cpu' | awk '{print 100-$8\"%\"}' 2>/dev/null || echo 'N/A') \
#[fg=#565f89] MEM:#[fg=#e0af68]#(LC_ALL=C free -m | awk '/Mem/{printf \"%.0f%%\", $3/$2*100}') \
#[bg=#3b4261,fg=#3b4261]#[bg=#3b4261] \
#[fg=#bb9af7]%Y-%m-%d #[fg=#7aa2f7,bold]%H:%M:%S"

# ── 윈도우 탭 스타일 ──────────────────────────
# 비활성 윈도우
set -g window-status-format "\
#[bg=#1a1b26,fg=#3b4261] \
#[fg=#565f89]#I \
#[fg=#a9b1d6]#W\
#[fg=#3b4261] "

# 활성 윈도우
set -g window-status-current-format "\
#[bg=#1a1b26,fg=#7aa2f7]\
#[bg=#7aa2f7,fg=#1a1b26,bold] #I \
#[fg=#1a1b26,bold]#W \
#[bg=#1a1b26,fg=#7aa2f7]"

# 윈도우 상태 (벨/활동)
set -g window-status-bell-style "bg=#f7768e,fg=#1a1b26,bold"
set -g window-status-activity-style "bg=#e0af68,fg=#1a1b26"

# ── Pane 내용 배경색 ───────────────────────────
set -g window-style "fg=#565f89,bg=#16161e"
set -g window-active-style "fg=#c0caf5,bg=#1a1b26"

# ── Pane 테두리 ────────────────────────────────
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines heavy

# ── 메시지/커맨드 창 ───────────────────────────
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g message-command-style "bg=#e0af68,fg=#1a1b26,bold"

# ── Copy mode 색상 ─────────────────────────────
set -g mode-style "bg=#364a82,fg=#c0caf5"

# ── 상태바 위치 ────────────────────────────────
set -g status-position bottom
set -g status-justify left
